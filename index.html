<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Математический тир: Отрицательные числа</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(160deg, #2a3a7a 0%, #1e2a5a 100%);
    color: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 24px 16px;
    user-select: none; overflow: hidden;
  }

  /* ===== Верхняя строка ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: nowrap;
    width: 100%; max-width: 420px;
    font-size: 0.9rem; opacity: 0.9;
    margin-bottom: 22px;
    padding-top: 8px;
    min-height: 2rem;
    gap: 8px;
  }
  .topbar > span { white-space: nowrap; }
  .topbar .rank {
    color: #7dd3fc;
    font-weight: 700;
    letter-spacing: 0.3px;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: transform 0.3s;
    display: inline-block;
  }
  .topbar .rank.pulse { animation: rankPulse 0.5s ease-out; }
  @keyframes rankPulse {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .hearts { font-size: 1.1rem; letter-spacing: 2px; }

  /* ===== Кнопка имени ===== */
  .name-btn {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.25);
    color: #fff;
    border-radius: 10px;
    padding: 6px 8px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .name-btn.unset {
    background: rgba(232,161,58,0.25);
    border-color: rgba(232,161,58,0.6);
    animation: namePulse 1.6s ease-in-out infinite;
  }
  @keyframes namePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  /* ===== Пример ===== */
  .task {
    font-size: 3.2rem; font-weight: 800; letter-spacing: 1px;
    margin: 10px 0 30px; text-align: center;
    text-shadow: 0 4px 12px rgba(0,0,0,0.4);
    transition: color 0.15s, transform 0.15s;
    min-height: 4rem;
  }
  .task.hit { color: #2ecc71; transform: scale(1.06); }

  /* ===== Ответы ===== */
  .answers {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; width: 100%; max-width: 420px;
  }
  .ball {
    padding: 26px 0; font-size: 1.9rem; font-weight: 600;
    border: none; border-radius: 18px; cursor: pointer;
    color: #fff; transition: transform 0.12s, background 0.15s, border 0.15s;
    box-shadow: 0 5px 0 rgba(0,0,0,0.3);
    background: #3d5a99;
  }
  .ball.positive { background: #4a9d8e; }
  .ball:active { transform: translateY(2px); box-shadow: 0 3px 0 rgba(0,0,0,0.3); }
  .ball.correct { background: #2ecc71 !important; animation: pop 0.25s ease-out; }
  .ball.wrong {
    background: #8a3a3a !important;
    opacity: 1;
    border: 2px solid #e05a6f;
  }
  .ball.reveal {
    background: #2ecc71 !important;
    opacity: 0.85;
    animation: pop 0.25s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  /* ===== Сообщение ===== */
  .msg {
    height: 1.6rem; margin-top: 16px;
    font-size: 1.1rem; font-weight: 700; text-align: center;
    opacity: 0; transition: opacity 0.15s;
  }
  .msg.show { opacity: 1; }

  /* ===== Кнопки ===== */
  .actions { margin-top: 18px; text-align: center; }
  .btn-main {
    padding: 13px 28px; font-size: 1rem; font-weight: 700;
    border: none; border-radius: 14px; cursor: pointer;
    background: #e6e9f0; color: #1e2a5a;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
    opacity: 0; transform: translateY(6px);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .btn-main.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .btn-main:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .link {
    display: block; margin: 12px auto 0;
    font-size: 0.85rem; color: rgba(255,255,255,0.6);
    background: none; border: none; cursor: pointer;
    text-decoration: underline; padding: 4px;
  }
  .link.secondary {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.4);
    margin-top: 6px;
  }

  /* ===== Меню ===== */
  #menu {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 420px;
    padding-top: 12px;
  }
  #menu h1 {
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 4px;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 8px rgba(0,0,0,0.35);
  }
  #menu h2.subtitle {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 26px;
    text-align: center;
    color: #7dd3fc;
    opacity: 1;
  }

  .mode-btn {
    width: 100%;
    padding: 18px 20px;
    margin-bottom: 14px;
    font-size: 1.15rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.35);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 5px 0 rgba(0,0,0,0.35);
    opacity: 1;
    transition: transform 0.1s;
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
  }
  .mode-btn:active {
    transform: translateY(2px);
    box-shadow: 0 3px 0 rgba(0,0,0,0.35);
  }
  .mode-btn .sym {
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1;
    opacity: 0.95;
    min-width: 2.2rem;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mode-btn .label { flex: 1; }
  #mode-addsub { background: #e05a6f; }
  #mode-muldiv { background: #3fb8a8; }
  #mode-all    { background: #e8a13a; }
  #mode-timed  { background: #9b5de5; }
  #mode-rating { background: #2ecc71; }

  #menu .author {
    margin: 14px 0 0;
    font-size: 0.75rem;
    font-weight: 400;
    color: #8a9bb5;
    text-align: center;
    letter-spacing: 0.3px;
    line-height: 1.4;
  }
  #menu .author b {
    font-weight: 600;
    color: #a3b3c9;
  }

  #game { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 420px; }
  #menu.hidden { display: none; }
  #game.visible { display: flex; }

  .confetti {
    position: fixed; top: -20px; width: 10px; height: 10px;
    border-radius: 2px; z-index: 15; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* ===== Таймер ===== */
  .timer {
    font-size: 1.4rem;
    font-weight: 800;
    color: #ffd166;
    margin-bottom: 8px;
    min-height: 1.6rem;
  }

  /* ===== Рейтинг ===== */
  #rating {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%; max-width: 420px;
  }
  #rating.visible { display: flex; }
  #rating h2 {
    font-size: 1.3rem;
    font-weight: 800;
    margin: 0 0 14px;
    color: #7dd3fc;
  }
  .rating-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    width: 100%;
  }
  .rating-tab {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    background: rgba(255,255,255,0.12);
    color: #fff;
  }
  .rating-tab.active {
    background: #2ecc71;
    color: #10202a;
  }
  .rating-list {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rating-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    font-size: 1rem;
  }
  .rating-row .pos {
    font-weight: 800;
    color: #7dd3fc;
    min-width: 2rem;
  }
  .rating-row .nm { flex: 1; text-align: left; margin-left: 8px; }
  .rating-row .sc { font-weight: 800; color: #ffd166; }
  .rating-empty {
    text-align: center;
    color: rgba(255,255,255,0.5);
    font-size: 0.95rem;
    padding: 24px 0;
  }

  /* ===== Модалка имени ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-overlay.visible { display: flex; }
  .modal-box {
    background: #2a3a7a;
    border-radius: 18px;
    padding: 24px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    text-align: center;
  }
  .modal-box h3 {
    margin: 0 0 14px;
    font-size: 1.2rem;
  }
  .modal-box input {
    width: 100%;
    padding: 14px;
    font-size: 1.1rem;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1);
    color: #fff;
    outline: none;
    margin-bottom: 14px;
    text-align: center;
  }
  .modal-box input:focus { border-color: #7dd3fc; }
  .modal-box .row {
    display: flex;
    gap: 10px;
  }
  .modal-box .row button {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .modal-box .save { background: #2ecc71; color: #10202a; }
  .modal-box .cancel { background: rgba(255,255,255,0.15); color: #fff; }
  .modal-box .clear {
    margin-top: 10px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.5);
    font-size: 0.8rem;
    cursor: pointer;
    text-decoration: underline;
  }

  @media (max-width: 360px) {
    body { padding: 18px 12px; }
    .topbar { font-size: 0.8rem; gap: 6px; margin-bottom: 16px; }
    .hearts { font-size: 0.95rem; letter-spacing: 1px; }
    .task { font-size: 2.7rem; margin: 8px 0 24px; }
    .ball { font-size: 1.6rem; padding: 22px 0; }
    .mode-btn { font-size: 1rem; padding: 16px 16px; }
    #menu .author { font-size: 0.7rem; }
    .name-btn { max-width: 80px; font-size: 0.72rem; }
  }
</style>
</head>
<body>

  <!-- ===== Меню ===== -->
  <div id="menu">
    <h1>🎯 Математический тир</h1>
    <h2 class="subtitle">🧊 Отрицательные числа</h2>
    
    <button class="mode-btn" id="mode-addsub">
      <span class="sym">+ −</span>
      <span class="label">Сложение и вычитание</span>
    </button>
    <button class="mode-btn" id="mode-muldiv">
      <span class="sym">× ÷ ^</span>
      <span class="label">Умножение, деление и степень</span>
    </button>
    <button class="mode-btn" id="mode-all">
      <span class="sym">🎲</span>
      <span class="label">Всё вместе</span>
    </button>
    <button class="mode-btn" id="mode-timed">
      <span class="sym">⏱️</span>
      <span class="label">Игра на время (60 сек)</span>
    </button>
    <button class="mode-btn" id="mode-rating">
      <span class="sym">🏆</span>
      <span class="label">Рейтинг</span>
    </button>

    <p class="author">
      Автор и создатель<br>
      <b>Алина Дмитриевна Оленева</b>
    </p>
  </div>

  <!-- ===== Игра ===== -->
  <div id="game">
    <div class="topbar">
      <span>Счёт: <b id="score">0</b></span>
      <span class="hearts" id="hearts">❤️❤️❤️❤️❤️</span>
      <span class="rank" id="rank">🌱 Новичок</span>
      <button class="name-btn unset" id="nameBtn">👤 Имя</button>
    </div>

    <div class="timer" id="timer"></div>
    <div class="task" id="task">…</div>
    <div class="answers" id="answers"></div>
    <div class="msg" id="msg"></div>

    <div class="actions">
      <button class="btn-main" id="continue">▶ Продолжить</button>
      <button class="link" id="restart">Начать заново</button>
      <button class="link secondary" id="back">← Сменить режим</button>
    </div>
  </div>

  <!-- ===== Рейтинг ===== -->
  <div id="rating">
    <h2>🏆 Рейтинг</h2>
    <div class="rating-tabs">
      <button class="rating-tab active" id="tabClassic">Общий</button>
      <button class="rating-tab" id="tabTimed">На время</button>
    </div>
    <div class="rating-list" id="ratingList"></div>
    <button class="link secondary" id="backFromRating" style="margin-top:24px;">← Назад в меню</button>
  </div>

  <!-- ===== Модалка имени ===== -->
  <div class="modal-overlay" id="nameModal">
    <div class="modal-box">
      <h3>Как тебя зовут?</h3>
      <input type="text" id="nameInput" maxlength="15" placeholder="Твоё имя">
      <div class="row">
        <button class="save" id="saveName">Сохранить</button>
        <button class="cancel" id="cancelName">Отмена</button>
      </div>
      <button class="clear" id="clearName">Стереть имя</button>
    </div>
  </div>

<script type="module">
  // ==========================================
  // 1. ИНИЦИАЛИЗАЦИЯ FIREBASE (Твои ключи)
  // ==========================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD0RMzcWPaGs2z6KA0qYnYReEzOxapDoiM",
    authDomain: "math-tir-rating.firebaseapp.com",
    databaseURL: "https://math-tir-rating-default-rtdb.firebaseio.com",
    projectId: "math-tir-rating",
    storageBucket: "math-tir-rating.firebasestorage.app",
    messagingSenderId: "560830825752",
    appId: "1:560830825752:web:a2c5df02f1917e40a24a6d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ==========================================
  // 2. ПЕРЕМЕННЫЕ И ЛОГИКА ИГРЫ
  // ==========================================
  const MAX_LIVES = 5;
  let score = 0, lives = MAX_LIVES, answer = 0, locked = false;
  let currentMode = 'all';
  let currentDisplayKey = '';
  let currentOp = '';
  let recentTasks = [];
  const RECENT_LIMIT = 8;
  let wrongQueue = [];
  
  let isTimedMode = false;
  let timeLeft = 60;
  let timerInterval = null;

  let playerName = localStorage.getItem('mathTirName') || '';
  let bestClassic = parseInt(localStorage.getItem('mathTirBestClassic') || '0', 10);
  let bestTimed = parseInt(localStorage.getItem('mathTirBestTimed') || '0', 10);

  const $ = id => document.getElementById(id);
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick1 = arr => arr[rnd(0, arr.length - 1)];

  function weightedPick(weights) {
    const total = weights.reduce((s, w) => s + w, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return weights.length - 1;
  }

  const RANKS = [
    { at: 0,   name: 'Новичок',              emoji: '🌱' },
    { at: 3,   name: 'Считатель',            emoji: '🔢' },
    { at: 5,   name: 'Умник',                emoji: '💡' },
    { at: 10,  name: 'Мастер счёта',         emoji: '🏆' },
    { at: 15,  name: 'Гений чисел',          emoji: '🧠' },
    { at: 20,  name: 'Профессор',            emoji: '🎓' },
    { at: 30,  name: 'Король математики',    emoji: '👑' },
    { at: 40,  name: 'Повелитель цифр',      emoji: '⚡' },
    { at: 50,  name: 'Суперсчётчик',         emoji: '🚀' },
    { at: 60,  name: 'Магистр формул',       emoji: '🔮' },
    { at: 70,  name: 'Легенда чисел',        emoji: '⭐' },
    { at: 80,  name: 'Алмазный ум',          emoji: '💎' },
    { at: 90,  name: 'Чемпион',              emoji: '🥇' },
    { at: 100, name: 'Абсолютный гений',     emoji: '🌟' },
  ];

  function rankFor(s) {
    let r = RANKS[0];
    for (const item of RANKS) if (s >= item.at) r = item;
    return r;
  }

  function confetti(n) {
    const colors = ['#ff6b6b','#4ecdc4','#ffa62b','#9b5de5','#7dd3fc','#a78bfa','#2ecc71'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = rnd(0, 100) + 'vw';
      c.style.background = colors[rnd(0, colors.length - 1)];
      c.style.animationDuration = (1 + Math.random() * 1.2) + 's';
      c.style.animationDelay = (Math.random() * 0.3) + 's';
      c.style.width = c.style.height = rnd(6, 12) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2500);
    }
  }

  function updateHearts() {
    $('hearts').textContent = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
  }

  const fmt = n => (n < 0 ? '−' + Math.abs(n) : '' + n);
  const wrap = n => (n < 0 ? `(${fmt(n)})` : `${n}`);
  const SUP = { 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸' };
  const EXP = { '³': 3, '⁴': 4, '⁵': 5, '⁶': 6, '⁷': 7, '⁸': 8 };

  function pickOp() {
    if (currentMode === 'addsub') return pick1(['+', '−']);
    if (currentMode === 'muldiv') {
      const ops = ['×', '÷', '^'];
      const w = [2, 2, 1];
      return ops[weightedPick(w)];
    }
    const ops = ['+', '−', '×', '÷', '^'];
    const w = [1, 1, 2, 2, 1];
    return ops[weightedPick(w)];
  }

  function buildTask() {
    const op = pickOp();
    let a, b, ans, display;

    if (op === '+' || op === '−') {
      const signCombos = [[1,1],[1,-1],[-1,1],[-1,-1]];
      const weights = [1, 3, 3, 3];
      const idx = weightedPick(weights);
      const [sa, sb] = signCombos[idx];
      a = sa * rnd(1, 100);
      b = sb * rnd(1, 100);

      if (op === '+') {
        ans = a + b;
        if (b < 0) display = `${fmt(a)} − ${Math.abs(b)} = ?`;
        else       display = `${fmt(a)} + ${b} = ?`;
      } else {
        ans = a - b;
        if (b < 0) display = `${fmt(a)} + ${Math.abs(b)} = ?`;
        else       display = `${fmt(a)} − ${b} = ?`;
      }
    } else if (op === '×') {
      const signCombos = [[1,1],[1,-1],[-1,1],[-1,-1]];
      const [sa, sb] = pick1(signCombos);
      a = sa * rnd(2, 12);
      b = sb * rnd(2, 12);
      ans = a * b;
      display = `${fmt(a)} × ${wrap(b)} = ?`;
    } else if (op === '÷') {
      const signCombos = [[1,1],[1,-1],[-1,1],[-1,-1]];
      const [sb, sq] = pick1(signCombos);
      const bDiv = sb * rnd(2, 12);
      const q = sq * rnd(2, 12);
      const aDiv = bDiv * q;
      ans = q;
      display = `${fmt(aDiv)} ÷ ${wrap(bDiv)} = ?`;
    } else {
      b = pick1([3, 4, 5, 6, 7, 8]);
      if (b === 3) {
        const bases3 = [];
        for (let v = -6; v <= 6; v++) bases3.push(v);
        a = pick1(bases3);
      } else if (b === 4) {
        a = pick1([-3, -2, -1, 0, 1, 2, 3]);
      } else if (b === 5) {
        a = pick1([-2, -1, 0, 1, 2]);
      } else {
        a = pick1([-2, 2]);
      }
      ans = Math.pow(a, b);
      display = `${wrap(a)}${SUP[b]} = ?`;
    }
    return { display, answer: ans, key: display, op, a, b };
  }

  function restoreTask(key) {
    const mPow = key.match(/^\(?(−?\d+)\)?([³⁴⁵⁶⁷⁸])\s=/);
    if (mPow) {
      const a = parseInt(mPow[1].replace('−', '-'), 10);
      const b = EXP[mPow[2]];
      return { display: key, answer: Math.pow(a, b), key, op: '^', a, b };
    }
    const m = key.match(/^(−?\d+)\s([+−×÷])\s(\(−?\d+\)|−?\d+)\s=/);
    if (!m) return null;
    const parseNum = s => parseInt(s.replace(/[()−]/g, ch => ch === '−' ? '-' : ''), 10);
    const a = parseNum(m[1]);
    const op = m[2];
    const b = parseNum(m[3]);
    let ans;
    if (op === '+') ans = a + b;
    else if (op === '−') ans = a - b;
    else if (op === '×') ans = a * b;
    else ans = a / b;
    return { display: key, answer: ans, key, op, a, b };
  }

  function makeDistractors(task) {
    const { op, answer, a, b } = task;
    const set = new Set();
    const add = v => {
      if (Number.isFinite(v) && Number.isInteger(v) && v !== answer) set.add(v);
    };

    if (op === '+' || op === '−') {
      add(-answer); add(Math.abs(answer)); add(answer + 10); add(answer - 10);
      add(answer + 1); add(answer - 1); add(a + b); add(a - b);
    } else if (op === '×' || op === '÷') {
      add(-answer); add(Math.abs(answer));
      if (op === '×') {
        add(answer + a); add(answer - a); add(answer + b); add(answer - b); add(a + b);
      } else {
        add(answer + 1); add(answer - 1); add(answer + 2); add(answer - 2); add(a - b);
      }
    } else if (op === '^') {
      add(a * b); add(-answer); add(Math.abs(answer));
      add(Math.pow(a, b - 1));
      if (b < 8) add(Math.pow(a, b + 1));
      add(a + b); add(a * a);
    }

    const scale = Math.max(2, Math.round(Math.abs(answer) * 0.2));
    let guard = 0;
    while (set.size < 8 && guard < 50) {
      guard++;
      add(answer + pick1([-scale, -Math.round(scale/2), Math.round(scale/2), scale, -1, 1, 2, -2]));
    }
    return [...set];
  }

  function makeTask() {
    let task = null;
    if (wrongQueue.length > 0 && Math.random() < 0.4) {
      const key = wrongQueue[Math.floor(Math.random() * wrongQueue.length)];
      const restored = restoreTask(key);
      if (restored) { task = restored; wrongQueue = wrongQueue.filter(k => k !== key); }
    }
    if (!task) {
      let attempts = 0;
      task = buildTask();
      while (recentTasks.includes(task.key) && attempts < 30) {
        task = buildTask(); attempts++;
      }
    }
    recentTasks.push(task.key);
    if (recentTasks.length > RECENT_LIMIT) recentTasks.shift();

    answer = task.answer;
    currentDisplayKey = task.key;
    currentOp = task.op;
    $('task').textContent = task.display;
    $('task').classList.remove('hit');

    const distractors = makeDistractors(task);
    for (let i = distractors.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [distractors[i], distractors[j]] = [distractors[j], distractors[i]];
    }
    const opts = new Set([answer]);
    for (const d of distractors) {
      if (opts.size >= 4) break;
      opts.add(d);
    }
    let guard = 0;
    while (opts.size < 4 && guard < 50) {
      guard++;
      opts.add(answer + rnd(-20, 20));
    }
    const arr = [...opts].sort(() => Math.random() - 0.5);

    const box = $('answers');
    box.innerHTML = '';
    arr.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'ball' + (v >= 0 ? ' positive' : '');
      btn.textContent = fmt(v);
      btn.dataset.value = v;
      btn.onclick = () => pick(btn, v);
      box.appendChild(btn);
    });
    locked = false;
    $('msg').classList.remove('show');
  }

  function pick(btn, value) {
    if (locked) return;
    locked = true;
    if (value === answer) {
      const prevRank = rankFor(score);
      score++;
      $('score').textContent = score;
      btn.classList.add('correct');
      $('task').classList.add('hit');
      $('msg').textContent = '✅ Верно!';
      $('msg').style.color = '#2ecc71';
      $('msg').classList.add('show');

      const newRank = rankFor(score);

      if (newRank.at > prevRank.at && !isTimedMode) {
        $('rank').textContent = `${newRank.emoji} ${newRank.name}`;
        $('rank').classList.remove('pulse');
        void $('rank').offsetWidth;
        $('rank').classList.add('pulse');
        confetti(40);
      }
      setTimeout(makeTask, 300);
    } else {
      if (!isTimedMode) {
        lives--;
        updateHearts();
      }
      btn.classList.add('wrong');
      document.querySelectorAll('.ball').forEach(b => {
        if (parseInt(b.dataset.value, 10) === answer) {
          b.classList.add('reveal');
        }
      });
      if (currentOp === '^') {
        $('msg').textContent = `❌ Правильно: ${fmt(answer)} · нечётная степень → знак основания, чётная → «+»`;
      } else {
        $('msg').textContent = `❌ Правильно: ${fmt(answer)}`;
      }
      $('msg').style.color = '#ff6b6b';
      $('msg').classList.add('show');

      if (currentDisplayKey && !wrongQueue.includes(currentDisplayKey)) {
        wrongQueue.push(currentDisplayKey);
        if (wrongQueue.length > 10) wrongQueue.shift();
      }
      
      if (!isTimedMode && lives <= 0) setTimeout(gameOver, 900);
      else setTimeout(makeTask, isTimedMode ? 600 : 1200);
    }
  }

  // ==========================================
  // 3. FIREBASE: ОТПРАВКА И ЗАГРУЗКА РЕЙТИНГА
  // ==========================================
  function saveScore(mode, finalScore) {
    if (!playerName) return;
    push(ref(db, `scores/${mode}`), {
      name: playerName,
      score: finalScore,
      timestamp: Date.now()
    }).catch(e => console.error(e));
  }

  function loadLeaderboard(mode, containerId) {
    const container = $(containerId);
    container.innerHTML = '<div class="rating-empty">Загрузка...</div>';
    
    // Берем последние 100 записей, чтобы найти максимумы
    const q = query(ref(db, `scores/${mode}`), limitToLast(100));
    onValue(q, (snapshot) => {
      const data = snapshot.val();
      container.innerHTML = '';
      if (!data) {
        container.innerHTML = '<div class="rating-empty">Пока нет результатов</div>';
        return;
      }
      
      const bestScores = {};
      Object.values(data).forEach(item => {
        if (!bestScores[item.name] || item.score > bestScores[item.name]) {
          bestScores[item.name] = item.score;
        }
      });
      
      const sorted = Object.keys(bestScores)
        .map(name => ({ name, score: bestScores[name] }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
        
      if (sorted.length === 0) {
        container.innerHTML = '<div class="rating-empty">Пока нет результатов</div>';
        return;
      }
      
      sorted.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'rating-row';
        row.innerHTML = `
          <span class="pos">${index + 1}</span>
          <span class="nm">${item.name}</span>
          <span class="sc">${item.score}</span>
        `;
        container.appendChild(row);
      });
    });
  }

  // ==========================================
  // 4. УПРАВЛЕНИЕ ИГРОЙ И ИНТЕРФЕЙСОМ
  // ==========================================
  function gameOver() {
    if (timerInterval) clearInterval(timerInterval);
    $('timer').textContent = '';
    $('task').textContent = isTimedMode ? '⏱️ Время вышло!' : '🏁 Жизни кончились!';
    $('answers').innerHTML = '';
    
    const r = rankFor(score);
    let bestType = isTimedMode ? 'mathTirBestTimed' : 'mathTirBestClassic';
    let best = isTimedMode ? bestTimed : bestClassic;
    let bestMsg = '';
    
    if (score > best) {
      localStorage.setItem(bestType, score);
      if (isTimedMode) bestTimed = score; else bestClassic = score;
      bestMsg = ' 🎉 Новый рекорд!';
      confetti(20);
    }
    
    $('msg').textContent = `Счёт: ${score} · ${r.emoji} ${r.name}${bestMsg}`;
    $('msg').style.color = '#fff';
    $('msg').classList.add('show');
    $('continue').classList.add('visible');
    
    // Отправляем в Firebase
    if (playerName) {
      saveScore(isTimedMode ? 'timed' : 'classic', score);
    }
  }

  function updateNameUI() {
    const btn = $('nameBtn');
    if (playerName) {
      btn.textContent = `👤 ${playerName}`;
      btn.classList.remove('unset');
    } else {
      btn.textContent = '👤 Имя';
      btn.classList.add('unset');
    }
  }

  $('nameBtn').onclick = () => {
    $('nameInput').value = playerName;
    $('nameModal').classList.add('visible');
    $('nameInput').focus();
  };

  $('saveName').onclick = () => {
    const val = $('nameInput').value.trim();
    if (val) {
      playerName = val;
      localStorage.setItem('mathTirName', val);
      updateNameUI();
    }
    $('nameModal').classList.remove('visible');
  };

  $('cancelName').onclick = () => {
    $('nameModal').classList.remove('visible');
  };

  $('clearName').onclick = () => {
    playerName = '';
    localStorage.removeItem('mathTirName');
    updateNameUI();
    $('nameModal').classList.remove('visible');
  };

  $('nameInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') $('saveName').click();
  });

  function startGame(mode) {
    currentMode = mode;
    isTimedMode = (mode === 'timed');
    
    if (isTimedMode) currentMode = 'all'; // Режим на время - это всегда всё вместе

    score = 0; lives = MAX_LIVES;
    recentTasks = []; wrongQueue = [];
    $('score').textContent = 0;
    updateHearts();
    $('rank').textContent = `${RANKS[0].emoji} ${RANKS[0].name}`;
    $('rank').classList.remove('pulse');
    $('continue').classList.remove('visible');
    
    $('menu').classList.add('hidden');
    $('rating').classList.remove('visible');
    $('game').classList.add('visible');
    
    if (isTimedMode) {
      $('hearts').style.visibility = 'hidden';
      $('rank').style.visibility = 'hidden';
      timeLeft = 60;
      $('timer').textContent = `⏱️ ${timeLeft} сек`;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        $('timer').textContent = `⏱️ ${timeLeft} сек`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          gameOver();
        }
      }, 1000);
    } else {
      $('hearts').style.visibility = 'visible';
      $('rank').style.visibility = 'visible';
      $('timer').textContent = '';
      if (timerInterval) clearInterval(timerInterval);
    }
    
    makeTask();
  }

  $('mode-addsub').onclick = () => startGame('addsub');
  $('mode-muldiv').onclick = () => startGame('muldiv');
  $('mode-all').onclick    = () => startGame('all');
  $('mode-timed').onclick  = () => startGame('timed');

  $('mode-rating').onclick = () => {
    $('menu').classList.add('hidden');
    $('rating').classList.add('visible');
    $('tabClassic').classList.add('active');
    $('tabTimed').classList.remove('active');
    loadLeaderboard('classic', 'ratingList');
  };

  $('tabClassic').onclick = () => {
    $('tabClassic').classList.add('active');
    $('tabTimed').classList.remove('active');
    loadLeaderboard('classic', 'ratingList');
  };

  $('tabTimed').onclick = () => {
    $('tabTimed').classList.add('active');
    $('tabClassic').classList.remove('active');
    loadLeaderboard('timed', 'ratingList');
  };

  $('backFromRating').onclick = () => {
    $('rating').classList.remove('visible');
    $('menu').classList.remove('hidden');
  };

  $('continue').onclick = () => {
    startGame(currentMode);
  };

  $('restart').onclick = () => {
    startGame(currentMode);
  };

  $('back').onclick = () => {
    if (timerInterval) clearInterval(timerInterval);
    $('game').classList.remove('visible');
    $('menu').classList.remove('hidden');
  };

  // Инициализация при загрузке
  updateNameUI();
</script>
</body>
