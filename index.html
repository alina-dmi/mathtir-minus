<script type="module">
  // ==========================================
  // 1. ИНИЦИАЛИЗАЦИЯ FIREBASE
  // ==========================================
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, push, onValue, query, limitToLast } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD0RMzcWPaGs2z6KA0qYnYReEzOxapDoiM",
    authDomain: "math-tir-rating.firebaseapp.com",
    databaseURL: "https://math-tir-rating-default-rtdb.firebaseio.com",
    projectId: "math-tir-rating",
    storageBucket: "math-tir-rating.firebasestorage.app",
    messagingSenderId: "560830825752",
    appId: "1:560830825752:web:a2c5df02f1917e40a24a6d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // ==========================================
  // 2. ПЕРЕМЕННЫЕ
  // ==========================================
  const MAX_LIVES = 5;
  let score = 0, lives = MAX_LIVES, answer = 0, locked = false;
  let currentMode = 'all';
  let currentDisplayKey = '';
  let currentOp = '';
  let recentTasks = [];
  const RECENT_LIMIT = 8;
  let wrongQueue = [];
  
  let isTimedMode = false;
  let timeLeft = 60;
  let timerInterval = null;

  let playerName = localStorage.getItem('mathTirName') || '';

  const $ = id => document.getElementById(id);
  const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
  const pick1 = arr => arr[rnd(0, arr.length - 1)];

  function weightedPick(weights) {
    const total = weights.reduce((s, w) => s + w, 0);
    let r = Math.random() * total;
    for (let i = 0; i < weights.length; i++) {
      r -= weights[i];
      if (r <= 0) return i;
    }
    return weights.length - 1;
  }

  const RANKS = [
    { at: 0,   name: 'Новичок',              emoji: '🌱' },
    { at: 3,   name: 'Считатель',            emoji: '🔢' },
    { at: 5,   name: 'Умник',                emoji: '💡' },
    { at: 10,  name: 'Мастер счёта',         emoji: '🏆' },
    { at: 15,  name: 'Гений чисел',          emoji: '🧠' },
    { at: 20,  name: 'Профессор',            emoji: '🎓' },
    { at: 30,  name: 'Король математики',    emoji: '👑' },
    { at: 40,  name: 'Повелитель цифр',      emoji: '⚡' },
    { at: 50,  name: 'Суперсчётчик',         emoji: '🚀' },
    { at: 60,  name: 'Магистр формул',       emoji: '🔮' },
    { at: 70,  name: 'Легенда чисел',        emoji: '⭐' },
    { at: 80,  name: 'Алмазный ум',          emoji: '💎' },
    { at: 90,  name: 'Чемпион',              emoji: '🥇' },
    { at: 100, name: 'Абсолютный гений',     emoji: '🌟' },
  ];

  function rankFor(s) {
    let r = RANKS[0];
    for (const item of RANKS) if (s >= item.at) r = item;
    return r;
  }

  function confetti(n) {
    const colors = ['#fca5a5','#5eead4','#fcd34d','#a5b4fc','#7dd3fc','#c084fc'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = rnd(0, 100) + 'vw';
      c.style.background = colors[rnd(0, colors.length - 1)];
      c.style.animationDuration = (1 + Math.random() * 1.2) + 's';
      c.style.animationDelay = (Math.random() * 0.3) + 's';
      c.style.width = c.style.height = rnd(6, 12) + 'px';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 2500);
    }
  }

  function updateHearts() {
    $('hearts').textContent = '❤️'.repeat(lives) + '🖤'.repeat(MAX_LIVES - lives);
  }

  const fmt = n => (n < 0 ? '−' + Math.abs(n) : '' + n);
  const wrap = n => (n < 0 ? `(${fmt(n)})` : `${n}`);
  const SUP = { 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸' };
  const EXP = { '³': 3, '⁴': 4, '⁵': 5, '⁶': 6, '⁷': 7, '⁸': 8 };

  function pickOp() {
    if (currentMode === 'addsub') return pick1(['+', '−']);
    if (currentMode === 'muldiv') {
      const ops = ['×', '÷', '^'];
      const w = [2, 2, 1];
      return ops[weightedPick(w)];
    }
    const ops = ['+', '−', '×', '÷', '^'];
    const w = [1, 1, 2, 2, 1];
    return ops[weightedPick(w)];
  }

  function buildTask() {
    const op = pickOp();
    let a, b, ans, display;

    if (op === '+' || op === '−') {
      const signCombos = [[1,1],[1,-1],[-1,1],[-1,-1]];
      const weights = [1, 3, 3, 3];
      const idx = weightedPick(weights);
      const [sa, sb] = signCombos[idx];
      a = sa * rnd(1, 100);
      b = sb * rnd(1, 100);

      if (op === '+') {
        ans = a + b;
        if (b < 0) display = `${fmt(a)} − ${Math.abs(b)} = ?`;
        else       display = `${fmt(a)} + ${b} = ?`;
      } else {
        ans = a - b;
        if (b < 0) display = `${fmt(a)} + ${Math.abs(b)} = ?`;
        else       display = `${fmt(a)} − ${b} = ?`;
      }
    } else if (op === '×') {
      const signCombos = [[1,1],[1,-1],[-1,1],[-1,-1]];
      const [sa, sb] = pick1(signCombos);
      a = sa * rnd(2, 12);
      b = sb * rnd(2, 12);
      ans = a * b;
      display = `${fmt(a)} × ${wrap(b)} = ?`;
    } else if (op === '÷') {
      const signCombos = [[1,1],[1,-1],[-1,1],[-1,-1]];
      const [sb, sq] = pick1(signCombos);
      const bDiv = sb * rnd(2, 12);
      const q = sq * rnd(2, 12);
      const aDiv = bDiv * q;
      ans = q;
      display = `${fmt(aDiv)} ÷ ${wrap(bDiv)} = ?`;
    } else {
      b = pick1([3, 4, 5, 6, 7, 8]);
      if (b === 3) {
        const bases3 = [];
        for (let v = -6; v <= 6; v++) bases3.push(v);
        a = pick1(bases3);
      } else if (b === 4) {
        a = pick1([-3, -2, -1, 0, 1, 2, 3]);
      } else if (b === 5) {
        a = pick1([-2, -1, 0, 1, 2]);
      } else {
        a = pick1([-2, 2]);
      }
      ans = Math.pow(a, b);
      display = `${wrap(a)}${SUP[b]} = ?`;
    }
    return { display, answer: ans, key: display, op, a, b };
  }

  function restoreTask(key) {
    const mPow = key.match(/^\(?(−?\d+)\)?([³⁴⁵⁶⁷⁸])\s=/);
    if (mPow) {
      const a = parseInt(mPow[1].replace('−', '-'), 10);
      const b = EXP[mPow[2]];
      return { display: key, answer: Math.pow(a, b), key, op: '^', a, b };
    }
    const m = key.match(/^(−?\d+)\s([+−×÷])\s(\(−?\d+\)|−?\d+)\s=/);
    if (!m) return null;
    const parseNum = s => parseInt(s.replace(/[()−]/g, ch => ch === '−' ? '-' : ''), 10);
    const a = parseNum(m[1]);
    const op = m[2];
    const b = parseNum(m[3]);
    let ans;
    if (op === '+') ans = a + b;
    else if (op === '−') ans = a - b;
    else if (op === '×') ans = a * b;
    else ans = a / b;
    return { display: key, answer: ans, key, op, a, b };
  }

  function makeDistractors(task) {
    const { op, answer, a, b } = task;
    const set = new Set();
    const add = v => {
      if (Number.isFinite(v) && Number.isInteger(v) && v !== answer) set.add(v);
    };

    if (op === '+' || op === '−') {
      add(-answer); add(Math.abs(answer)); add(answer + 10); add(answer - 10);
      add(answer + 1); add(answer - 1); add(a + b); add(a - b);
    } else if (op === '×' || op === '÷') {
      add(-answer); add(Math.abs(answer));
      if (op === '×') {
        add(answer + a); add(answer - a); add(answer + b); add(answer - b); add(a + b);
      } else {
        add(answer + 1); add(answer - 1); add(answer + 2); add(answer - 2); add(a - b);
      }
    } else if (op === '^') {
      add(a * b); add(-answer); add(Math.abs(answer));
      add(Math.pow(a, b - 1));
      if (b < 8) add(Math.pow(a, b + 1));
      add(a + b); add(a * a);
    }

    const scale = Math.max(2, Math.round(Math.abs(answer) * 0.2));
    let guard = 0;
    while (set.size < 8 && guard < 50) {
      guard++;
      add(answer + pick1([-scale, -Math.round(scale/2), Math.round(scale/2), scale, -1, 1, 2, -2]));
    }
    return [...set];
  }

  function makeTask() {
    let task = null;
    if (wrongQueue.length > 0 && Math.random() < 0.4) {
      const key = wrongQueue[Math.floor(Math.random() * wrongQueue.length)];
      const restored = restoreTask(key);
      if (restored) { task = restored; wrongQueue = wrongQueue.filter(k => k !== key); }
    }
    if (!task) {
      let attempts = 0;
      task = buildTask();
      while (recentTasks.includes(task.key) && attempts < 30) {
        task = buildTask(); attempts++;
      }
    }
    recentTasks.push(task.key);
    if (recentTasks.length > RECENT_LIMIT) recentTasks.shift();

    answer = task.answer;
    currentDisplayKey = task.key;
    currentOp = task.op;
    $('task').textContent = task.display;
    $('task').classList.remove('hit');

    const distractors = makeDistractors(task);
    for (let i = distractors.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [distractors[i], distractors[j]] = [distractors[j], distractors[i]];
    }
    const opts = new Set([answer]);
    for (const d of distractors) {
      if (opts.size >= 4) break;
      opts.add(d);
    }
    let guard = 0;
    while (opts.size < 4 && guard < 50) {
      guard++;
      opts.add(answer + rnd(-20, 20));
    }
    const arr = [...opts].sort(() => Math.random() - 0.5);

    const box = $('answers');
    box.innerHTML = '';
    arr.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'ball' + (v >= 0 ? ' positive' : '');
      btn.textContent = fmt(v);
      btn.dataset.value = v;
      btn.onclick = () => pick(btn, v);
      box.appendChild(btn);
    });
    locked = false;
    $('msg').classList.remove('show');
  }

  function pick(btn, value) {
    if (locked) return;
    locked = true;
    if (value === answer) {
      const prevRank = rankFor(score);
      score++;
      $('score').textContent = score;
      btn.classList.add('correct');
      $('task').classList.add('hit');
      $('msg').textContent = '✅ Верно!';
      $('msg').style.color = '#6ee7b7';
      $('msg').classList.add('show');

      const newRank = rankFor(score);
      if (newRank.at > prevRank.at && !isTimedMode) {
        $('rank').textContent = `${newRank.emoji} ${newRank.name}`;
        $('rank').classList.remove('pulse');
        void $('rank').offsetWidth;
        $('rank').classList.add('pulse');
        confetti(40);
      }
      setTimeout(makeTask, 300);
    } else {
      if (!isTimedMode) {
        lives--;
        updateHearts();
      }
      btn.classList.add('wrong');
      document.querySelectorAll('.ball').forEach(b => {
        if (parseInt(b.dataset.value, 10) === answer) {
          b.classList.add('reveal');
        }
      });
      if (currentOp === '^') {
        $('msg').textContent = `❌ Правильно: ${fmt(answer)} · нечётная степень → знак основания, чётная → «+»`;
      } else {
        $('msg').textContent = `❌ Правильно: ${fmt(answer)}`;
      }
      $('msg').style.color = '#fca5a5';
      $('msg').classList.add('show');

      if (currentDisplayKey && !wrongQueue.includes(currentDisplayKey)) {
        wrongQueue.push(currentDisplayKey);
        if (wrongQueue.length > 10) wrongQueue.shift();
      }
      
      if (!isTimedMode && lives <= 0) setTimeout(gameOver, 900);
      else setTimeout(makeTask, isTimedMode ? 600 : 1200);
    }
  }

  // ==========================================
  // 3. FIREBASE: ОТПРАВКА И ЗАГРУЗКА РЕЙТИНГА
  // ==========================================
  
  function saveScore(mode, finalScore) {
    if (!playerName) return;
    push(ref(db, `scores/${mode}`), {
      name: playerName,
      score: finalScore,
      timestamp: Date.now()
    }).catch(e => console.error(e));
  }

  // Умное сохранение: только если результат лучше прошлого
  function checkAndSaveRecord() {
    if (score === 0 || !playerName) return;

    const recordKey = isTimedMode ? 'mathTirBestTimed' : 'mathTirBestClassic';
    const currentBest = parseInt(localStorage.getItem(recordKey) || '0', 10);

    if (score > currentBest) {
      localStorage.setItem(recordKey, score);
      saveScore(isTimedMode ? 'timed' : 'classic', score);
    }
  }

  function loadLeaderboard(mode, containerId) {
    const container = $(containerId);
    container.innerHTML = '<div class="rating-empty">Загрузка...</div>';
    
    const q = query(ref(db, `scores/${mode}`), limitToLast(100));
    onValue(q, (snapshot) => {
      const data = snapshot.val();
      container.innerHTML = '';
      if (!data) {
        container.innerHTML = '<div class="rating-empty">Пока нет результатов</div>';
        return;
      }
      
      const bestScores = {};
      Object.values(data).forEach(item => {
        if (!bestScores[item.name] || item.score > bestScores[item.name]) {
          bestScores[item.name] = item.score;
        }
      });
      
      const sorted = Object.keys(bestScores)
        .map(name => ({ name, score: bestScores[name] }))
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
        
      if (sorted.length === 0) {
        container.innerHTML = '<div class="rating-empty">Пока нет результатов</div>';
        return;
      }
      
      sorted.forEach((item, index) => {
        const row = document.createElement('div');
        row.className = 'rating-row';
        row.innerHTML = `
          <span class="pos">${index + 1}</span>
          <span class="nm">${item.name}</span>
          <span class="sc">${item.score}</span>
        `;
        container.appendChild(row);
      });
    });
  }

  // ==========================================
  // 4. УПРАВЛЕНИЕ ИГРОЙ И ИНТЕРФЕЙСОМ
  // ==========================================
  function gameOver() {
    if (timerInterval) clearInterval(timerInterval);
    $('timer').textContent = '';
    $('task').textContent = isTimedMode ? '⏱️ Время вышло!' : '🏁 Жизни кончились!';
    $('answers').innerHTML = '';
    
    const r = rankFor(score);
    
    $('msg').textContent = `Счёт: ${score} · ${r.emoji} ${r.name}`;
    $('msg').style.color = '#fff';
    $('msg').classList.add('show');
    $('continue').classList.add('visible');
    
    if (playerName) {
      saveScore(isTimedMode ? 'timed' : 'classic', score);
      const recordKey = isTimedMode ? 'mathTirBestTimed' : 'mathTirBestClassic';
      const currentBest = parseInt(localStorage.getItem(recordKey) || '0', 10);
      if (score > currentBest) localStorage.setItem(recordKey, score);
    }
  }

  function updateNameUI() {
    $('profileName').textContent = playerName || 'Гость';
  }

  function showNameModal() {
    $('nameInput').value = playerName;
    $('nameModal').classList.add('visible');
    $('nameInput').focus();
  }

  $('editNameBtn').onclick = showNameModal;
  
  $('saveName').onclick = () => {
    const val = $('nameInput').value.trim();
    if (val) {
      playerName = val;
      localStorage.setItem('mathTirName', val);
      updateNameUI();
      $('nameModal').classList.remove('visible');
    } else {
      const inp = $('nameInput');
      inp.style.transform = 'translateX(5px)';
      setTimeout(() => inp.style.transform = 'translateX(-5px)', 50);
      setTimeout(() => inp.style.transform = 'translateX(5px)', 100);
      setTimeout(() => inp.style.transform = 'translateX(0)', 150);
    }
  };

  $('nameInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') $('saveName').click();
  });

  function startGame(mode) {
    currentMode = mode;
    isTimedMode = (mode === 'timed');
    if (isTimedMode) currentMode = 'all';

    score = 0; lives = MAX_LIVES;
    recentTasks = []; wrongQueue = [];
    $('score').textContent = 0;
    updateHearts();
    $('rank').textContent = `${RANKS[0].emoji} ${RANKS[0].name}`;
    $('rank').classList.remove('pulse');
    $('continue').classList.remove('visible');
    
    $('menu').classList.add('hidden');
    $('rating').classList.remove('visible');
    $('game').classList.add('visible');
    
    if (isTimedMode) {
      $('hearts').style.visibility = 'hidden';
      $('rank').style.visibility = 'hidden';
      timeLeft = 60;
      $('timer').textContent = `⏱️ ${timeLeft} сек`;
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        $('timer').textContent = `⏱️ ${timeLeft} сек`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          gameOver();
        }
      }, 1000);
    } else {
      $('hearts').style.visibility = 'visible';
      $('rank').style.visibility = 'visible';
      $('timer').textContent = '';
      if (timerInterval) clearInterval(timerInterval);
    }
    
    makeTask();
  }

  $('mode-addsub').onclick = () => startGame('addsub');
  $('mode-muldiv').onclick = () => startGame('muldiv');
  $('mode-all').onclick    = () => startGame('all');
  $('mode-timed').onclick  = () => startGame('timed');

  $('openRatingBtn').onclick = () => {
    $('menu').classList.add('hidden');
    $('rating').classList.add('visible');
    $('tabClassic').classList.add('active');
    $('tabTimed').classList.remove('active');
    loadLeaderboard('classic', 'ratingList');
  };

  $('tabClassic').onclick = () => {
    $('tabClassic').classList.add('active');
    $('tabTimed').classList.remove('active');
    loadLeaderboard('classic', 'ratingList');
  };

  $('tabTimed').onclick = () => {
    $('tabTimed').classList.add('active');
    $('tabClassic').classList.remove('active');
    loadLeaderboard('timed', 'ratingList');
  };

  $('backFromRating').onclick = () => {
    $('rating').classList.remove('visible');
    $('menu').classList.remove('hidden');
  };

  $('continue').onclick = () => startGame(currentMode);
  $('restart').onclick = () => startGame(currentMode);
  
  $('back').onclick = () => {
    if (timerInterval) clearInterval(timerInterval);
    checkAndSaveRecord(); // Сохраняем при выходе!
    $('game').classList.remove('visible');
    $('menu').classList.remove('hidden');
  };

  window.addEventListener('beforeunload', () => {
    checkAndSaveRecord(); // Сохраняем при закрытии вкладки!
  });

  updateNameUI();
  if (!playerName) showNameModal();
</script>
</body>
</html>
